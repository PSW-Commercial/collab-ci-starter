name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    name: continuous-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run continuity checks
        run: |
          set -euo pipefail
          echo "CI smoke test started"
          test -n "$(ls -A)"
          echo "CI smoke test passed"
